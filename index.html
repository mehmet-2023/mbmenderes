<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBM Menderes - GELİYORUZ!</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@700&family=Anton&family=Open+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            overflow-x: hidden;
            user-select: none;
        }

        #hero {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #151515;
            background-image: 
                radial-gradient(circle, #2a2a2a 2px, transparent 2px),
                radial-gradient(circle, #2a2a2a 2px, transparent 2px);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
            overflow: hidden;
            padding: clamp(86px, 11vh, 118px) clamp(12px, 3vw, 30px) clamp(12px, 3vw, 30px);
        }

        .comic-panels-bg {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            padding: 12px;
            opacity: 0.18;
            pointer-events: none;
            z-index: 1;
            transform: skewY(-2deg) scale(1.05);
        }

        .comic-panel {
            border: 4px solid #ffffff;
            background: linear-gradient(135deg, #1f1f1f 0%, #050505 100%);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }

        .brawl-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }

        .brawl-cloud {
            position: absolute;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
        }

        .asymmetric-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1300px;
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            gap: clamp(15px, 3vw, 30px);
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .asymmetric-container.visible {
            opacity: 1;
        }

        .asymmetric-container * {
            pointer-events: auto;
        }

        .header-asymmetric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding-top: 10px;
            gap: 15px;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.8s ease-out;
        }

        .header-asymmetric.show {
            opacity: 1;
            transform: translateY(0);
        }

        .logo-badge {
            background-color: #000000;
            border: 4px solid #E2C044;
            border-radius: 50%;
            width: clamp(80px, 11vw, 150px);
            height: clamp(80px, 11vw, 150px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                6px 6px 0px #000000,
                0 0 25px rgba(226, 192, 68, 0.4);
            transform: rotate(-10deg);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            flex-shrink: 0;
            overflow: hidden;
            padding: 8px;
        }

        .logo-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-badge:hover {
            transform: rotate(5deg) scale(1.1);
            border-color: #ffffff;
            box-shadow: 10px 10px 0px #E2C044;
        }

        .event-tag {
            background: #E2C044;
            color: #000;
            font-family: 'Bangers', cursive;
            font-size: clamp(1rem, 1.8vw, 1.8rem);
            padding: clamp(6px, 1vw, 10px) clamp(12px, 2vw, 22px);
            border: 4px solid #000;
            transform: rotate(4deg);
            box-shadow: 5px 5px 0px #000;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .title-stack-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin: 10px 0;
            position: relative;
            cursor: pointer;
            width: 100%;
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .title-stack-container.intro-centered {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.1);
            z-index: 150;
            width: max-content;
            margin: 0;
            pointer-events: none;
        }

        .single-line-text {
            font-family: 'Anton', impact, sans-serif;
            font-size: clamp(3rem, 10vw, 10rem);
            line-height: 0.85;
            text-transform: uppercase;
            color: #E2C044;
            -webkit-text-stroke: clamp(2px, 0.4vw, 5px) #000000;
            paint-order: stroke fill;
            text-shadow: clamp(5px, 0.9vw, 12px) clamp(5px, 0.9vw, 12px) 0px #000000;
            transform: rotate(-3deg);
            filter: drop-shadow(0 0 25px rgba(226, 192, 68, 0.4));
            letter-spacing: 2px;
            white-space: nowrap;
            transition: all 0.8s ease;
        }

        .sub-explode-text {
            font-family: 'Anton', impact, sans-serif;
            font-size: clamp(2.5rem, 8.5vw, 8.5rem);
            line-height: 0.85;
            text-transform: uppercase;
            color: #ffffff;
            -webkit-text-stroke: clamp(2px, 0.35vw, 4px) #000000;
            paint-order: stroke fill;
            text-shadow: clamp(4px, 0.7vw, 10px) clamp(4px, 0.7vw, 10px) 0px #000000;
            transform: rotate(2deg) translateX(4vw);
            letter-spacing: 1px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
        }

        .sub-explode-text.exploded {
            opacity: 1;
            animation: explodeIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .asymmetric-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: clamp(15px, 3vw, 30px);
            width: 100%;
            margin-top: auto;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-out;
        }

        .asymmetric-footer.show {
            opacity: 1;
            transform: translateY(0);
        }

        .cta-btn {
            padding: clamp(12px, 1.8vw, 20px) clamp(20px, 3vw, 42px);
            font-family: 'Bangers', cursive;
            font-size: clamp(1.2rem, 2.3vw, 2.2rem);
            letter-spacing: clamp(1px, 0.2vw, 2px);
            color: #000000;
            background-color: #E2C044;
            border: clamp(3px, 0.4vw, 5px) solid #000000;
            cursor: pointer;
            box-shadow: clamp(5px, 0.7vw, 9px) clamp(5px, 0.7vw, 9px) 0px #000000;
            text-transform: uppercase;
            transform: rotate(2.5deg);
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .cta-btn:hover {
            background-color: #ffffff;
            transform: rotate(-1deg) scale(1.04);
            box-shadow: clamp(7px, 0.9vw, 12px) clamp(7px, 0.9vw, 12px) 0px #E2C044;
        }

        .cta-btn:active {
            transform: scale(0.96);
            box-shadow: 3px 3px 0px #000000;
        }

        .skip-intro-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 250;
            background: #000;
            color: #E2C044;
            border: 3px solid #E2C044;
            font-family: 'Bangers', cursive;
            padding: clamp(8px, 1.2vw, 12px) clamp(16px, 2vw, 28px);
            font-size: clamp(1rem, 1.5vw, 1.4rem);
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 5px 5px 0 #E2C044;
            transition: all 0.2s;
        }

        .skip-intro-btn:hover {
            background: #E2C044;
            color: #000;
            box-shadow: 5px 5px 0 #fff;
        }

        @keyframes explodeIn {
            0% { 
                opacity: 0; 
                transform: rotate(2deg) translateX(4vw) scale(2.8); 
                filter: drop-shadow(0 0 60px #E2C044); 
            }
            60% { 
                opacity: 1; 
                transform: rotate(2deg) translateX(4vw) scale(0.9); 
            }
            100% { 
                opacity: 1; 
                transform: rotate(2deg) translateX(4vw) scale(1); 
            }
        }

        @keyframes smokeAnim {
            0% { opacity: 0; transform: scale(0.2) translateY(0); }
            50% { opacity: 0.95; }
            100% { opacity: 0; transform: scale(1.6) translateY(-50px); }
        }

        @keyframes punchAnim {
            0% { opacity: 0; transform: scale(0) rotate(-20deg); }
            40% { opacity: 1; transform: scale(1.3) rotate(10deg); }
            80% { opacity: 1; transform: scale(1.1) rotate(-5deg); }
            100% { opacity: 0; transform: scale(0.8) rotate(15deg); }
        }

        .smoke-cloud-interactive {
            position: absolute;
            pointer-events: none;
            z-index: 25;
            animation: smokeAnim 0.8s ease-out forwards;
        }

        .punch-fx-interactive {
            position: absolute;
            pointer-events: none;
            z-index: 30;
            animation: punchAnim 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .applications-section {
            position: relative;
            width: 100%;
            padding: clamp(70px, 9vw, 140px) clamp(16px, 4vw, 60px) clamp(70px, 10vw, 140px);
            background-color: #0d0d0d;
            background-image:
                radial-gradient(circle, rgba(150, 150, 150, 0.13) 2px, transparent 2px),
                radial-gradient(circle, rgba(255, 255, 255, 0.05) 2px, transparent 2px);
            background-size: 26px 26px, 26px 26px;
            background-position: 0 0, 13px 13px;
            border-top: 6px solid #000000;
            overflow: hidden;
            isolation: isolate;
            scroll-margin-top: 76px;
            animation: appDotsDrift 24s linear infinite;
        }

        .applications-section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 16px;
            background: repeating-linear-gradient(90deg, #E2C044 0 34px, #000000 34px 68px);
            z-index: 4;
        }

        .applications-section::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(160, 160, 160, 0.08), transparent 55%);
            pointer-events: none;
            z-index: 1;
        }

        .applications-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .app-bg-rays {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 170vmax;
            height: 170vmax;
            margin: -85vmax 0 0 -85vmax;
            background: repeating-conic-gradient(
                from 0deg,
                rgba(160, 160, 160, 0.1) 0deg 5deg,
                transparent 5deg 18deg
            );
            animation: appRaysSpin 55s linear infinite;
            -webkit-mask-image: radial-gradient(circle, #000000 0%, transparent 62%);
            mask-image: radial-gradient(circle, #000000 0%, transparent 62%);
            opacity: 0.75;
        }

        .app-bg-speedlines {
            position: absolute;
            inset: -30%;
            background: repeating-linear-gradient(
                115deg,
                transparent 0 38px,
                rgba(255, 255, 255, 0.055) 38px 42px,
                transparent 42px 96px
            );
            animation: appSpeedSlide 9s linear infinite;
        }

        .app-bg-symbols span {
            position: absolute;
            left: var(--x);
            top: var(--y);
            font-family: 'Bangers', cursive;
            font-size: clamp(1.5rem, 3vw, 3.2rem);
            letter-spacing: 2px;
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(170, 170, 170, 0.35);
            transform: rotate(var(--r));
            animation: appSymbolFloat var(--dur) ease-in-out infinite alternate;
            animation-delay: var(--delay);
            opacity: 0.8;
        }

        .app-bg-symbols span:nth-child(2n) {
            -webkit-text-stroke-color: rgba(255, 255, 255, 0.22);
        }

        @keyframes appDotsDrift {
            0% {
                background-position: 0 0, 13px 13px;
            }
            100% {
                background-position: 52px 26px, 65px 39px;
            }
        }

        @keyframes appRaysSpin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes appSpeedSlide {
            from {
                transform: translate3d(-90px, 0, 0);
            }
            to {
                transform: translate3d(90px, 0, 0);
            }
        }

        @keyframes appSymbolFloat {
            from {
                transform: translateY(0) rotate(var(--r));
            }
            to {
                transform: translateY(-28px) rotate(calc(var(--r) + 9deg));
            }
        }

        .applications-header {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: clamp(12px, 1.6vw, 20px);
            max-width: 900px;
            margin: 0 auto;
        }

        .applications-kicker {
            display: inline-block;
            background: #E2C044;
            color: #000000;
            font-family: 'Bangers', cursive;
            font-size: clamp(0.9rem, 1.5vw, 1.3rem);
            letter-spacing: 3px;
            padding: 8px clamp(14px, 2vw, 22px);
            border: 4px solid #000000;
            transform: rotate(3deg);
            box-shadow: 5px 5px 0px #000000;
        }

        .applications-title {
            font-family: 'Anton', impact, sans-serif;
            font-size: clamp(2.8rem, 7vw, 6.5rem);
            line-height: 0.9;
            text-transform: uppercase;
            color: #E2C044;
            -webkit-text-stroke: clamp(2px, 0.35vw, 4px) #000000;
            paint-order: stroke fill;
            text-shadow: clamp(5px, 0.8vw, 10px) clamp(5px, 0.8vw, 10px) 0px #000000;
            transform: rotate(-3deg);
            letter-spacing: 2px;
        }

        .applications-title span {
            color: inherit;
        }

        .applications-desc {
            font-family: 'Caveat', cursive;
            font-weight: 700;
            font-size: clamp(1.2rem, 2.2vw, 1.8rem);
            line-height: 1.3;
            color: #d8d8d8;
            max-width: 620px;
        }

        .applications-fees {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 4px 10px;
            margin-top: 2px;
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px dashed rgba(226, 192, 68, 0.6);
            font-family: 'Open Sans', sans-serif;
            font-size: clamp(0.62rem, 0.78vw, 0.74rem);
            letter-spacing: 0.4px;
            color: #bdbdbd;
            transform: rotate(-1deg);
        }

        .applications-fees strong {
            color: #E2C044;
            font-weight: 800;
        }

        .applications-fees .fee-divider {
            color: #555555;
        }

        .section-sticker {
            position: absolute;
            z-index: 2;
            font-family: 'Bangers', cursive;
            font-size: clamp(1.2rem, 2vw, 2rem);
            letter-spacing: 2px;
            padding: 8px 18px;
            color: #ffffff;
            background: #E63946;
            border: 4px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            text-shadow: 2px 2px 0px #000000;
            pointer-events: none;
        }

        .sticker-one {
            top: 13%;
            left: 4%;
            transform: rotate(-12deg);
        }

        .sticker-two {
            top: 22%;
            right: 4%;
            background: #3A86FF;
            transform: rotate(9deg);
        }

        .sticker-three {
            bottom: 8%;
            left: 8%;
            background: #E2C044;
            color: #000000;
            text-shadow: none;
            transform: rotate(-7deg);
        }

        .application-grid {
            position: relative;
            z-index: 3;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: clamp(18px, 2.2vw, 30px);
            max-width: 1320px;
            margin: clamp(35px, 5vw, 65px) auto 0;
        }

        @media (max-width: 1300px) {
            .application-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                max-width: 1000px;
            }
        }

        .app-card {
            --accent: #E2C044;
            --tilt: 0deg;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            min-height: 100%;
            padding: clamp(20px, 2vw, 28px);
            padding-top: clamp(28px, 2.6vw, 38px);
            background: linear-gradient(160deg, #202020 0%, #070707 100%);
            border: 5px solid #ffffff;
            box-shadow: 9px 9px 0px var(--accent);
            transform: rotate(var(--tilt));
            text-decoration: none;
            color: #ffffff;
            overflow: hidden;
            opacity: 1;
            transition: transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.28s ease, border-color 0.28s ease;
        }

        .applications-section:not(.in-view) .app-card {
            opacity: 0;
            transform: translateY(50px) rotate(var(--tilt));
        }

        .applications-section.in-view .app-card {
            animation: cardSlam 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
            animation-delay: var(--delay, 0s);
        }

        .app-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: var(--accent);
            border-bottom: 4px solid #000000;
            z-index: 1;
        }

        .app-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.14) 1.5px, transparent 1.5px);
            background-size: 14px 14px;
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
        }

        .app-card > * {
            position: relative;
            z-index: 2;
        }

        .app-card:hover,
        .app-card:focus-visible {
            transform: translateY(-12px) rotate(0deg) scale(1.03);
            box-shadow: 14px 14px 0px var(--accent), 0 0 32px rgba(226, 192, 68, 0.18);
            border-color: var(--accent);
            outline: none;
        }

        .app-card:focus-visible {
            outline: 4px dashed #ffffff;
            outline-offset: 5px;
        }

        .app-number {
            position: absolute;
            top: 16px;
            right: 16px;
            font-family: 'Bangers', cursive;
            font-size: clamp(2.6rem, 4vw, 4rem);
            line-height: 1;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.35);
            transform: rotate(8deg);
            transition: all 0.3s ease;
            z-index: 2;
        }

        .app-card:hover .app-number,
        .app-card:focus-visible .app-number {
            color: var(--accent);
            -webkit-text-stroke: 2px #000000;
            text-shadow: 3px 3px 0px #000000;
        }

        .app-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: clamp(64px, 6vw, 84px);
            height: clamp(64px, 6vw, 84px);
            margin-top: 8px;
            background: var(--accent);
            border: 4px solid #000000;
            border-radius: 50%;
            box-shadow: 4px 4px 0px #000000;
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .app-icon svg {
            width: 64%;
            height: 64%;
            overflow: visible;
        }

        .app-card:hover .app-icon,
        .app-card:focus-visible .app-icon {
            transform: rotate(-8deg) scale(1.08);
        }

        .app-name {
            font-family: 'Bangers', cursive;
            font-size: clamp(1.8rem, 2.4vw, 2.5rem);
            letter-spacing: 2px;
            line-height: 1;
            color: #ffffff;
            -webkit-text-stroke: 1px #000000;
            paint-order: stroke fill;
            text-shadow: 3px 3px 0px var(--accent);
            margin-top: 2px;
        }

        .app-desc {
            font-family: 'Open Sans', sans-serif;
            font-size: clamp(0.82rem, 1vw, 0.95rem);
            line-height: 1.55;
            color: #cfcfcf;
            flex: 1 1 auto;
        }

        .app-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding: 9px 18px;
            font-family: 'Bangers', cursive;
            font-size: clamp(1rem, 1.3vw, 1.2rem);
            letter-spacing: 2px;
            color: #000000;
            background: var(--accent);
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #ffffff;
            transition: all 0.2s ease;
        }

        .app-card:hover .app-cta,
        .app-card:focus-visible .app-cta {
            background: #ffffff;
            box-shadow: 4px 4px 0px var(--accent);
            transform: translateX(4px);
        }

        .applications-note {
            position: relative;
            z-index: 3;
            margin-top: clamp(30px, 4vw, 50px);
            text-align: center;
            font-family: 'Caveat', cursive;
            font-weight: 700;
            font-size: clamp(1rem, 1.6vw, 1.35rem);
            color: #9a9a9a;
            transform: rotate(-1deg);
        }

        .committees-section {
            position: relative;
            width: 100%;
            padding: clamp(70px, 9vw, 140px) clamp(16px, 4vw, 60px);
            background-color: #101a2b;
            background-image:
                repeating-linear-gradient(135deg, rgba(46, 196, 182, 0.11) 0 14px, transparent 14px 34px),
                repeating-linear-gradient(45deg, rgba(226, 192, 68, 0.06) 0 2px, transparent 2px 28px);
            background-size: 68px 68px, 56px 56px;
            border-top: 6px solid #000000;
            overflow: hidden;
            isolation: isolate;
            scroll-margin-top: 76px;
            animation: committeeBgDrift 26s linear infinite;
        }

        .committees-section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;

            inset: 0;

        .committee-bubbles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;

        .committee-bubble {
            position: absolute;
            left: var(--x);
            top: var(--y);
            padding: 8px 16px;
            background: rgba(8, 12, 20, 0.82);
            color: var(--bubble);
            border: 3px solid var(--bubble);
            border-radius: 18px 18px 18px 4px;

            opacity: 0.5;
            animation: committeeBubbleFloat var(--dur) ease-in-out infinite alternate;
            animation-delay: var(--delay);

            content: "";
            position: absolute;
            left: 14px;
            bottom: -10px;
            width: 12px;
            height: 12px;

            from {

                <div className="footer-inner">
                    <div className="footer-brand">
                        <img src={logoUrl} alt="MBM Menderes Logo" className="footer-logo" />
                        <div className="footer-brand-text">
                            <span className="footer-title">MBM MENDERES</span>
                            <span className="footer-sub">MODEL BİRLEŞMİŞ MİLLETLER</span>
                        </div>
                    </div>

                    <div className="footer-credit">
                        website by: <span>OCAL</span>
                    </div>
                </div>

                <div className="footer-bottom">
                    <span>© {new Date().getFullYear()} MBM Menderes</span>
                    <span>Adnan Menderes Anadolu Lisesi</span>
                </div>
            </footer>
        );

        const CartoonBrawlFight = () => {
            const [brawlItems, setBrawlItems] = React.useState([]);

            React.useEffect(() => {
                const interval = setInterval(() => {
                    const id = Date.now() + Math.random();
                    const types = ['smoke', 'fist', 'pow', 'wham', 'bam', 'kaboom', 'zap'];
                    const type = types[Math.floor(Math.random() * types.length)];

                    const top = Math.floor(Math.random() * 85) + 5;
                    const left = Math.floor(Math.random() * 85) + 5;
                    const size = Math.floor(Math.random() * 100) + 110;
                    const rotate = Math.floor(Math.random() * 80) - 40;

                    const newItem = { id, type, top, left, size, rotate };

                    setBrawlItems(prev => [...prev.slice(-16), newItem]);
                }, 220);

                return () => clearInterval(interval);
            }, []);

            return (
                <div className="brawl-container">
                    {brawlItems.map((item) => (
                        <div
                            key={item.id}
                            className="brawl-cloud"
                            style={{
                                top: `${item.top}%`,
                                left: `${item.left}%`,
                                width: `${item.size}px`,
                                height: `${item.size}px`,
                                transform: `rotate(${item.rotate}deg)`,
                                animation: 'punchAnim 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards'
                            }}
                        >
                            {item.type === 'smoke' && <SmokeCloudSVG color="#FFFFFF" />}
                            {item.type === 'fist' && <FistIconSVG />}
                            {item.type === 'pow' && <PunchPopSVG text="POW!" />}
                            {item.type === 'wham' && <PunchPopSVG text="WHAM!" />}
                            {item.type === 'bam' && <PunchPopSVG text="BAM!" />}
                            {item.type === 'kaboom' && <PunchPopSVG text="BOOM!" />}
                            {item.type === 'zap' && <PunchPopSVG text="KAPOW!" />}
                        </div>
                    ))}
                </div>
            );
        };

        const App = () => {
            const [introStep, setIntroStep] = React.useState(1);
            const [interactiveEffects, setInteractiveEffects] = React.useState([]);
            const isIntroLocked = introStep < 3;

            React.useEffect(() => {
                if (!isIntroLocked) return;

                const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
                const previousOverflow = document.body.style.overflow;
                const previousPaddingRight = document.body.style.paddingRight;

                document.body.style.overflow = "hidden";

                if (scrollbarWidth > 0) {
                    document.body.style.paddingRight = `${scrollbarWidth}px`;
                }

                window.scrollTo({ top: 0, left: 0, behavior: "instant" });

                const preventScroll = (event) => event.preventDefault();
                const preventScrollKeys = (event) => {
                    const blockedKeys = ["ArrowUp", "ArrowDown", "PageUp", "PageDown", "Home", "End", " "];

                    if (blockedKeys.includes(event.key)) {
                        event.preventDefault();
                    }
                };

                window.addEventListener("wheel", preventScroll, { passive: false });
                window.addEventListener("touchmove", preventScroll, { passive: false });
                window.addEventListener("keydown", preventScrollKeys);

                return () => {
                    document.body.style.overflow = previousOverflow;
                    document.body.style.paddingRight = previousPaddingRight;
                    window.removeEventListener("wheel", preventScroll);
                    window.removeEventListener("touchmove", preventScroll);
                    window.removeEventListener("keydown", preventScrollKeys);
                };
            }, [isIntroLocked]);

            React.useEffect(() => {
                const timer2 = setTimeout(() => {
                    setIntroStep(2);
                }, 1800);

                const timer3 = setTimeout(() => {
                    setIntroStep(3);
                }, 3000);

                return () => {
                    clearTimeout(timer2);
                    clearTimeout(timer3);
                };
            }, []);

            const skipIntro = () => {
                setIntroStep(3);
            };

            const triggerExplosionFX = (x, y) => {
                const soundPops = ["BOOM!", "KAPOW!", "BAM!", "ZAP!", "WHAM!"];
                const randomPop = soundPops[Math.floor(Math.random() * soundPops.length)];

                const newBatch = [
                    { id: Date.now() + 1, type: 'punch', x: x - 80, y: y - 60, text: randomPop },
                    { id: Date.now() + 2, type: 'smoke', x: x - 100, y: y - 100, size: 220 },
                    { id: Date.now() + 3, type: 'smoke', x: x - 160, y: y - 40, size: 150 },
                    { id: Date.now() + 4, type: 'smoke', x: x + 20, y: y - 40, size: 150 }
                ];

                setInteractiveEffects((prev) => [...prev, ...newBatch]);

                setTimeout(() => {
                    setInteractiveEffects((prev) => prev.filter(item => !newBatch.find(b => b.id === item.id)));
                }, 800);
            };

            const handleHeroClick = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                triggerExplosionFX(clickX, clickY);
            };

            const handleHeroCtaClick = (e) => {
                handleHeroClick(e);

                setTimeout(() => {
                    const section = document.getElementById("basvuru");

                    if (section) {
                        section.scrollIntoView({ behavior: "smooth", block: "start" });
                    }
                }, 250);
            };

            return (
                <>
                {introStep >= 3 && <Navbar />}
                <div id="hero">
                    <div className="comic-panels-bg">
                        {[...Array(12)].map((_, i) => (
                            <div key={i} className="comic-panel"></div>
                        ))}
                    </div>

                    <CartoonBrawlFight />

                    {introStep < 3 && (
                        <button className="skip-intro-btn" onClick={skipIntro}>
                            İNTROYU GEÇ ➔
                        </button>
                    )}

                    <div className={`asymmetric-container ${introStep >= 1 ? 'visible' : ''}`}>
                        <div className={`header-asymmetric ${introStep >= 2 ? 'show' : ''}`}>
                            <div className="logo-badge" title="MBM Menderes Logo">
                                <img src={logoUrl} alt="MBM Menderes Logo" />
                            </div>

                            <div className="event-tag">
                                MODEL BİRLEŞMİŞ MİLLETLER
                            </div>
                        </div>

                        <div 
                            className={`title-stack-container ${introStep === 1 ? 'intro-centered' : ''}`}
                            onClick={introStep === 3 ? handleHeroClick : undefined}
                        >
                            <div className="single-line-text">
                                GELİYORUZ!
                            </div>
                            
                            <div className={`sub-explode-text ${introStep === 3 ? 'exploded' : ''}`}>
                                MBMENDERES
                            </div>
                        </div>

                        <div className={`hero-countdown-wrap ${introStep >= 3 ? 'show' : ''}`}>
                            <Countdown />
                        </div>

                        <div className={`asymmetric-footer ${introStep >= 2 ? 'show' : ''}`}>
                            <button className="cta-btn" onClick={handleHeroCtaClick}>
                                HEMEN BAŞVUR ➔
                            </button>
                        </div>
                    </div>

                    {interactiveEffects.map((fx) => {
                        if (fx.type === 'smoke') {
                            return (
                                <div
                                    key={fx.id}
                                    className="smoke-cloud-interactive"
                                    style={{
                                        left: fx.x,
                                        top: fx.y,
                                        width: fx.size,
                                        height: fx.size
                                    }}
                                >
                                    <SmokeCloudSVG color="#FFFFFF" />
                                </div>
                            );
                        }
                        if (fx.type === 'punch') {
                            return (
                                <div
                                    key={fx.id}
                                    className="punch-fx-interactive"
                                    style={{
                                        left: fx.x,
                                        top: fx.y
                                    }}
                                >
                                    <PunchPopSVG text={fx.text} />
                                </div>
                            );
                        }
                        return null;
                    })}
                </div>
                <CommitteesSection />
                <ApplicationSection />
                <SiteFooter />
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
