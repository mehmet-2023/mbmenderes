<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBM Menderes - GELİYORUZ!</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@700&family=Anton&family=Open+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            overflow-x: hidden;
            user-select: none;
        }

        #hero {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #151515;
            background-image: 
                radial-gradient(circle, #2a2a2a 2px, transparent 2px),
                radial-gradient(circle, #2a2a2a 2px, transparent 2px);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
            overflow: hidden;
            padding: clamp(12px, 3vw, 30px);
        }

        .comic-panels-bg {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            padding: 12px;
            opacity: 0.18;
            pointer-events: none;
            z-index: 1;
            transform: skewY(-2deg) scale(1.05);
        }

        .comic-panel {
            border: 4px solid #ffffff;
            background: linear-gradient(135deg, #1f1f1f 0%, #050505 100%);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }

        .brawl-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }

        .brawl-cloud {
            position: absolute;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
        }

        .asymmetric-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1300px;
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            gap: clamp(15px, 3vw, 30px);
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .asymmetric-container.visible {
            opacity: 1;
        }

        .asymmetric-container * {
            pointer-events: auto;
        }

        .header-asymmetric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding-top: 10px;
            gap: 15px;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.8s ease-out;
        }

        .header-asymmetric.show {
            opacity: 1;
            transform: translateY(0);
        }

        .logo-badge {
            background-color: #000000;
            border: 4px solid #E2C044;
            border-radius: 50%;
            width: clamp(80px, 11vw, 150px);
            height: clamp(80px, 11vw, 150px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                6px 6px 0px #000000,
                0 0 25px rgba(226, 192, 68, 0.4);
            transform: rotate(-10deg);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            flex-shrink: 0;
            overflow: hidden;
            padding: 8px;
        }

        .logo-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-badge:hover {
            transform: rotate(5deg) scale(1.1);
            border-color: #ffffff;
            box-shadow: 10px 10px 0px #E2C044;
        }

        .event-tag {
            background: #E2C044;
            color: #000;
            font-family: 'Bangers', cursive;
            font-size: clamp(1rem, 1.8vw, 1.8rem);
            padding: clamp(6px, 1vw, 10px) clamp(12px, 2vw, 22px);
            border: 4px solid #000;
            transform: rotate(4deg);
            box-shadow: 5px 5px 0px #000;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .title-stack-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin: 10px 0;
            position: relative;
            cursor: pointer;
            width: 100%;
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .title-stack-container.intro-centered {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.1);
            z-index: 150;
            width: max-content;
            margin: 0;
            pointer-events: none;
        }

        .single-line-text {
            font-family: 'Anton', impact, sans-serif;
            font-size: clamp(3rem, 10vw, 10rem);
            line-height: 0.85;
            text-transform: uppercase;
            color: #E2C044;
            -webkit-text-stroke: clamp(2px, 0.4vw, 5px) #000000;
            paint-order: stroke fill;
            text-shadow: clamp(5px, 0.9vw, 12px) clamp(5px, 0.9vw, 12px) 0px #000000;
            transform: rotate(-3deg);
            filter: drop-shadow(0 0 25px rgba(226, 192, 68, 0.4));
            letter-spacing: 2px;
            white-space: nowrap;
            transition: all 0.8s ease;
        }

        .sub-explode-text {
            font-family: 'Anton', impact, sans-serif;
            font-size: clamp(2.5rem, 8.5vw, 8.5rem);
            line-height: 0.85;
            text-transform: uppercase;
            color: #ffffff;
            -webkit-text-stroke: clamp(2px, 0.35vw, 4px) #000000;
            paint-order: stroke fill;
            text-shadow: clamp(4px, 0.7vw, 10px) clamp(4px, 0.7vw, 10px) 0px #000000;
            transform: rotate(2deg) translateX(4vw);
            letter-spacing: 1px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
        }

        .sub-explode-text.exploded {
            opacity: 1;
            animation: explodeIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .asymmetric-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: clamp(15px, 3vw, 30px);
            width: 100%;
            margin-top: auto;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-out;
        }

        .asymmetric-footer.show {
            opacity: 1;
            transform: translateY(0);
        }

        .hero-subtitle-box {
            background-color: #000000;
            border: clamp(3px, 0.4vw, 5px) solid #E2C044;
            padding: clamp(12px, 2vw, 20px) clamp(16px, 2.5vw, 28px);
            transform: rotate(-1.5deg);
            box-shadow: clamp(4px, 0.6vw, 8px) clamp(4px, 0.6vw, 8px) 0px #E2C044;
            flex: 1 1 auto;
            width: 100%;
            max-width: clamp(300px, 55vw, 700px);
        }

        .subtitle-text {
            font-family: 'Caveat', cursive;
            font-size: clamp(1.1rem, 2.2vw, 1.9rem);
            color: #ffffff;
            line-height: 1.35;
            font-weight: 700;
            word-break: break-word;
        }

        .cta-btn {
            padding: clamp(12px, 1.8vw, 20px) clamp(20px, 3vw, 42px);
            font-family: 'Bangers', cursive;
            font-size: clamp(1.2rem, 2.3vw, 2.2rem);
            letter-spacing: clamp(1px, 0.2vw, 2px);
            color: #000000;
            background-color: #E2C044;
            border: clamp(3px, 0.4vw, 5px) solid #000000;
            cursor: pointer;
            box-shadow: clamp(5px, 0.7vw, 9px) clamp(5px, 0.7vw, 9px) 0px #000000;
            text-transform: uppercase;
            transform: rotate(2.5deg);
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .cta-btn:hover {
            background-color: #ffffff;
            transform: rotate(-1deg) scale(1.04);
            box-shadow: clamp(7px, 0.9vw, 12px) clamp(7px, 0.9vw, 12px) 0px #E2C044;
        }

        .cta-btn:active {
            transform: scale(0.96);
            box-shadow: 3px 3px 0px #000000;
        }

        .cinema-intro-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(8, 8, 8, 0.85);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }

        .marvel-logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: marvelFadeInOut 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .marvel-logo-img {
            width: clamp(180px, 35vw, 380px);
            height: auto;
            filter: drop-shadow(0 0 35px rgba(226, 192, 68, 0.6));
        }

        .skip-intro-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 250;
            background: #000;
            color: #E2C044;
            border: 3px solid #E2C044;
            font-family: 'Bangers', cursive;
            padding: clamp(8px, 1.2vw, 12px) clamp(16px, 2vw, 28px);
            font-size: clamp(1rem, 1.5vw, 1.4rem);
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 5px 5px 0 #E2C044;
            transition: all 0.2s;
        }

        .skip-intro-btn:hover {
            background: #E2C044;
            color: #000;
            box-shadow: 5px 5px 0 #fff;
        }

        @keyframes marvelFadeInOut {
            0% { opacity: 0; transform: scale(0.7) blur(10px); }
            35% { opacity: 1; transform: scale(1); filter: blur(0px); }
            65% { opacity: 1; transform: scale(1.06); filter: blur(0px); }
            100% { opacity: 0; transform: scale(1.25); filter: blur(15px); }
        }

        @keyframes explodeIn {
            0% { 
                opacity: 0; 
                transform: rotate(2deg) translateX(4vw) scale(2.8); 
                filter: drop-shadow(0 0 60px #E2C044); 
            }
            60% { 
                opacity: 1; 
                transform: rotate(2deg) translateX(4vw) scale(0.9); 
            }
            100% { 
                opacity: 1; 
                transform: rotate(2deg) translateX(4vw) scale(1); 
            }
        }

        @keyframes smokeAnim {
            0% { opacity: 0; transform: scale(0.2) translateY(0); }
            50% { opacity: 0.95; }
            100% { opacity: 0; transform: scale(1.6) translateY(-50px); }
        }

        @keyframes punchAnim {
            0% { opacity: 0; transform: scale(0) rotate(-20deg); }
            40% { opacity: 1; transform: scale(1.3) rotate(10deg); }
            80% { opacity: 1; transform: scale(1.1) rotate(-5deg); }
            100% { opacity: 0; transform: scale(0.8) rotate(15deg); }
        }

        .smoke-cloud-interactive {
            position: absolute;
            pointer-events: none;
            z-index: 25;
            animation: smokeAnim 0.8s ease-out forwards;
        }

        .punch-fx-interactive {
            position: absolute;
            pointer-events: none;
            z-index: 30;
            animation: punchAnim 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @media (max-width: 850px) {
            .asymmetric-footer {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }

            .hero-subtitle-box {
                max-width: 100%;
                transform: rotate(-1deg);
            }

            .cta-btn {
                width: 100%;
                text-align: center;
                transform: rotate(0deg);
            }

            .single-line-text {
                transform: rotate(-2deg);
            }

            .sub-explode-text {
                transform: rotate(1deg) translateX(0);
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const logoUrl = "logo.jpg";

        const SmokeCloudSVG = ({ color = "#FFFFFF" }) => (
            <svg viewBox="0 0 200 200" width="100%" height="100%">
                <path
                    fill={color}
                    stroke="#000000"
                    strokeWidth="6"
                    strokeLinejoin="round"
                    d="M 50 130 
                       C 20 130, 10 100, 30 80 
                       C 20 50, 50 30, 80 40 
                       C 100 10, 140 20, 150 50 
                       C 180 40, 190 70, 180 100 
                       C 195 120, 180 150, 150 150 
                       C 130 165, 90 165, 70 145 
                       Z"
                />
            </svg>
        );

        const PunchPopSVG = ({ text = "POW!" }) => (
            <svg viewBox="0 0 120 120" width="130" height="130">
                <path
                    fill="#E2C044"
                    stroke="#000000"
                    strokeWidth="5"
                    d="M 60 10 L 75 35 L 105 25 L 90 55 L 115 75 L 85 85 L 80 115 L 55 95 L 30 110 L 35 80 L 10 70 L 30 50 L 15 25 L 45 35 Z"
                />
                <text x="50%" y="54%" dominantBaseline="middle" textAnchor="middle" fontSize="28" fontFamily="Bangers, sans-serif" fontWeight="bold" fill="#000">
                    {text}
                </text>
            </svg>
        );

        const FistIconSVG = () => (
            <svg viewBox="0 0 100 100" width="100" height="100">
                <path
                    fill="#FFFFFF"
                    stroke="#000000"
                    strokeWidth="4"
                    d="M20,60 C10,50 15,30 35,25 C45,10 75,15 80,35 C95,40 90,70 75,80 C60,90 30,85 20,60 Z"
                />
                <circle cx="40" cy="45" r="5" fill="#000" />
                <circle cx="60" cy="45" r="5" fill="#000" />
                <path d="M 35 65 Q 50 75 65 65" stroke="#000" strokeWidth="4" fill="none" />
            </svg>
        );

        const CartoonBrawlFight = () => {
            const [brawlItems, setBrawlItems] = React.useState([]);

            React.useEffect(() => {
                const interval = setInterval(() => {
                    const id = Date.now() + Math.random();
                    const types = ['smoke', 'fist', 'pow', 'wham', 'bam', 'kaboom', 'zap'];
                    const type = types[Math.floor(Math.random() * types.length)];
                    
                    const top = Math.floor(Math.random() * 85) + 5;
                    const left = Math.floor(Math.random() * 85) + 5;
                    const size = Math.floor(Math.random() * 100) + 110;
                    const rotate = Math.floor(Math.random() * 80) - 40;

                    const newItem = { id, type, top, left, size, rotate };

                    setBrawlItems(prev => [...prev.slice(-16), newItem]);
                }, 220);

                return () => clearInterval(interval);
            }, []);

            return (
                <div className="brawl-container">
                    {brawlItems.map((item) => (
                        <div
                            key={item.id}
                            className="brawl-cloud"
                            style={{
                                top: `${item.top}%`,
                                left: `${item.left}%`,
                                width: `${item.size}px`,
                                height: `${item.size}px`,
                                transform: `rotate(${item.rotate}deg)`,
                                animation: 'punchAnim 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards'
                            }}
                        >
                            {item.type === 'smoke' && <SmokeCloudSVG color="#FFFFFF" />}
                            {item.type === 'fist' && <FistIconSVG />}
                            {item.type === 'pow' && <PunchPopSVG text="POW!" />}
                            {item.type === 'wham' && <PunchPopSVG text="WHAM!" />}
                            {item.type === 'bam' && <PunchPopSVG text="BAM!" />}
                            {item.type === 'kaboom' && <PunchPopSVG text="BOOM!" />}
                            {item.type === 'zap' && <PunchPopSVG text="KAPOW!" />}
                        </div>
                    ))}
                </div>
            );
        };

        const App = () => {
            const [introStep, setIntroStep] = React.useState(0);
            const [interactiveEffects, setInteractiveEffects] = React.useState([]);

            React.useEffect(() => {
                const timer1 = setTimeout(() => {
                    setIntroStep(1);
                }, 2500);

                const timer2 = setTimeout(() => {
                    setIntroStep(2);
                }, 4300);

                const timer3 = setTimeout(() => {
                    setIntroStep(3);
                }, 5200);

                return () => {
                    clearTimeout(timer1);
                    clearTimeout(timer2);
                    clearTimeout(timer3);
                };
            }, []);

            const skipIntro = () => {
                setIntroStep(3);
            };

            const triggerExplosionFX = (x, y) => {
                const soundPops = ["BOOM!", "KAPOW!", "BAM!", "ZAP!", "WHAM!"];
                const randomPop = soundPops[Math.floor(Math.random() * soundPops.length)];

                const newBatch = [
                    { id: Date.now() + 1, type: 'punch', x: x - 80, y: y - 60, text: randomPop },
                    { id: Date.now() + 2, type: 'smoke', x: x - 100, y: y - 100, size: 220 },
                    { id: Date.now() + 3, type: 'smoke', x: x - 160, y: y - 40, size: 150 },
                    { id: Date.now() + 4, type: 'smoke', x: x + 20, y: y - 40, size: 150 }
                ];

                setInteractiveEffects((prev) => [...prev, ...newBatch]);

                setTimeout(() => {
                    setInteractiveEffects((prev) => prev.filter(item => !newBatch.find(b => b.id === item.id)));
                }, 800);
            };

            const handleHeroClick = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                triggerExplosionFX(clickX, clickY);
            };

            return (
                <div id="hero">
                    <div className="comic-panels-bg">
                        {[...Array(12)].map((_, i) => (
                            <div key={i} className="comic-panel"></div>
                        ))}
                    </div>

                    <CartoonBrawlFight />

                    {introStep === 0 && (
                        <div className="cinema-intro-overlay">
                            <div className="marvel-logo-container">
                                <img src={logoUrl} alt="MBM Menderes Logo" className="marvel-logo-img" />
                            </div>
                        </div>
                    )}

                    {introStep < 3 && (
                        <button className="skip-intro-btn" onClick={skipIntro}>
                            İNTROYU GEÇ ➔
                        </button>
                    )}

                    <div className={`asymmetric-container ${introStep >= 1 ? 'visible' : ''}`}>
                        <div className={`header-asymmetric ${introStep >= 2 ? 'show' : ''}`}>
                            <div className="logo-badge" title="MBM Menderes Logo">
                                <img src={logoUrl} alt="MBM Menderes Logo" />
                            </div>

                            <div className="event-tag">
                                MODEL BİRLEŞMİŞ MİLLETLER
                            </div>
                        </div>

                        <div 
                            className={`title-stack-container ${introStep === 1 ? 'intro-centered' : ''}`}
                            onClick={introStep === 3 ? handleHeroClick : undefined}
                        >
                            <div className="single-line-text">
                                GELİYORUZ!
                            </div>
                            
                            <div className={`sub-explode-text ${introStep === 3 ? 'exploded' : ''}`}>
                                MBMENDERES
                            </div>
                        </div>

                        <div className={`asymmetric-footer ${introStep >= 2 ? 'show' : ''}`}>
                            <div className="hero-subtitle-box">
                                <p className="subtitle-text">
                                    Menderes Model Birleşmiş Milletler Konferansı. Dünyayı değiştirecek kararlar burada alınıyor!
                                </p>
                            </div>

                            <button className="cta-btn" onClick={handleHeroClick}>
                                DELEGE BAŞVURUSU YAP ➔
                            </button>
                        </div>
                    </div>

                    {interactiveEffects.map((fx) => {
                        if (fx.type === 'smoke') {
                            return (
                                <div
                                    key={fx.id}
                                    className="smoke-cloud-interactive"
                                    style={{
                                        left: fx.x,
                                        top: fx.y,
                                        width: fx.size,
                                        height: fx.size
                                    }}
                                >
                                    <SmokeCloudSVG color="#FFFFFF" />
                                </div>
                            );
                        }
                        if (fx.type === 'punch') {
                            return (
                                <div
                                    key={fx.id}
                                    className="punch-fx-interactive"
                                    style={{
                                        left: fx.x,
                                        top: fx.y
                                    }}
                                >
                                    <PunchPopSVG text={fx.text} />
                                </div>
                            );
                        }
                        return null;
                    })}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
